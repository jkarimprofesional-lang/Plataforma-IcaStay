version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: icastay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icastay_user
      POSTGRES_PASSWORD: icastay_password
      POSTGRES_DB: icastay_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_icastay:/var/lib/postgresql/data

volumes:
  pgdata_icastay: